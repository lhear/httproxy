name: Cross-Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  build-linux-musl:
    needs: lint-audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - name: Install Cross
        run: |
          curl -L https://github.com/cross-rs/cross/releases/latest/download/cross-x86_64-unknown-linux-musl.tar.gz | tar xz -C /usr/local/bin
      - name: Build with Cross
        run: cross build --release --target ${{ matrix.target }}
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: httproxy-linux-musl-${{ matrix.target == 'aarch64-unknown-linux-musl' && 'arm64' || 'x86_64' }}
          path: |
            target/${{ matrix.target }}/release/client
            target/${{ matrix.target }}/release/server

  build-windows:
    needs: lint-audit
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x86_64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        run: rustup target add ${{ matrix.target }}
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: httproxy-windows-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/client.exe
            target/${{ matrix.target }}/release/server.exe

  build-darwin-arm64:
    needs: lint-audit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        run: rustup target add aarch64-apple-darwin
      - name: Build
        run: cargo build --release --target aarch64-apple-darwin
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: httproxy-darwin-arm64
          path: |
            target/aarch64-apple-darwin/release/client
            target/aarch64-apple-darwin/release/server

  build-android:
    needs: lint-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        run: rustup target add aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Build
        run: |
          cargo ndk --target aarch64-linux-android --platform 21 build --release
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: httproxy-android-arm64
          path: |
            target/aarch64-linux-android/release/client
            target/aarch64-linux-android/release/server

  create-release:
    needs: [build-linux-musl, build-windows, build-darwin-arm64, build-android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate Full License Bundle
        run: |
          cargo install cargo-bundle-licenses
          cargo bundle-licenses --format yaml --output THIRD-PARTY-LICENSES.txt
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package Assets
        run: |
          mkdir dist
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            zip -j "dist/${name}.zip" "$dir"/* CONFIGURATION.md README.md LICENSE THIRD-PARTY-LICENSES.txt || true
          done
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
