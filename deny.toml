[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "MPL-2.0",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "OpenSSL",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "LGPL-3.0",
]
confidence-threshold = 0.8
private = {ignore = false}

[bans]
multiple-versions = "warn"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
