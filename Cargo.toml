[package]
edition = "2024"
license = "MPL-2.0"
name = "httproxy"
rust-version = "1.99"
version = "0.5.6"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

[dependencies]
anyhow = "1.0.104"
aws-lc-rs = "1.19.0"
axum = {version = "0.8.9", features = ["http2", "macros"]}
base122-fast = "0.1.9"
base64 = "0.23.1"
bytes = "1.12.1"
clap = {version = "4.6.7", features = ["derive"]}
dashmap = "6.2.1"
domain = "0.12.3"
fst = "0.4.7"
futures = "0.3.34"
h2 = "0.4.20"
http = "1.5.0"
http-body-util = "0.1.5"
httparse = "1.10.1"
ip_network = "0.4.1"
ip_network_table = "0.2.0"
memchr = "2.8.3"
moka = {version = "0.12.16", features = ["future"]}
p256 = {version = "0.14.0", features = ["ecdsa", "pkcs8"]}
pin-project-lite = "0.2.17"
quinn = {version = "0.11.12", default-features = false, features = [
  "runtime-tokio",
  "rustls-aws-lc-rs",
]}
rand = "0.10.3"
rand_distr = "0.6.0"
rcgen = {version = "0.14.10", default-features = false, features = [
  "crypto",
  "aws_lc_rs",
]}
rustls = "0.23.46"
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.154"
singleflight-async = "0.2.0"
tokio = {version = "1.54.1", features = ["rt-multi-thread", "test-util"]}
tokio-rustls = "0.26.6"
tokio-socks = "0.5.3"
tokio-stream = {version = "0.1.19", features = ["net"]}
toml = "1.2.1"
tower = "0.5.3"
tower-http = {version = "0.7.1", features = ["trace"]}
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = {version = "0.3.23", features = [
  "env-filter",
  "chrono",
  "json",
]}
url = "2.5.8"
uuid = "1.29.2"
webpki-roots = "1.0.12"
wreq = "0.16.3"
wreq-util = "0.2.1"
x25519-dalek = {version = "3.0.0", features = ["static_secrets", "getrandom", "zeroize"]}
zeroize = "1.9.1"

[dev-dependencies]
axum = {version = "0.8.9", features = ["http2", "macros"]}
quinn = {version = "0.11.12", default-features = false, features = [
  "runtime-tokio",
  "rustls-aws-lc-rs",
]}
rcgen = {version = "0.14.10", default-features = false, features = [
  "crypto",
  "aws_lc_rs",
]}
rustls = "0.23.46"
serde_json = "1.0.154"
tokio = {version = "1.54.1", features = ["full"]}
tracing-subscriber = {version = "0.3.23", features = ["env-filter"]}
wreq = "0.16.3"
wreq-util = "0.2.1"
