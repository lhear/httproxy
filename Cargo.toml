[package]
edition = "2024"
license = "MPL-2.0"
name = "httproxy"
version = "0.1.15"

[[bin]]
name = "server"
path = "src/server.rs"

[[bin]]
name = "client"
path = "src/client.rs"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

[dependencies]
anyhow = "1.0"
axum = {version = "0.8.9", features = ["http2", "macros"]}
bytes = "1.11"
clap = {version = "4.6.1", features = ["derive"]}
domain = "0.11"
fst = "0.4.7"
futures = "0.3"
h2 = "0.4"
http = "1.4"
http-body = "1.0"
http-body-util = "0.1"
httparse = "1.10"
ip_network = "0.4.1"
ip_network_table = "0.2.0"
jsonwebtoken = {version = "10.2", features = ["aws_lc_rs"]}
moka = {version = "0.12", features = ["future"]}
pin-project-lite = "0.2"
rand = "0.10"
rand_distr = "0.6"
rustls = "0.23.38"
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0.149"
singleflight-async = "0.2"
tokio = {version = "1.52.1", features = ["rt-multi-thread"]}
tokio-rustls = "0.26"
tokio-socks = "0.5"
tokio-stream = {version = "0.1", features = ["net"]}
toml = "1.1"
tower = "0.5"
tower-http = {version = "0.6", features = ["trace"]}
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = {version = "0.3", features = [
  "env-filter",
  "chrono",
  "json",
]}
url = "2.5"
webpki-roots = "1.0.7"
wreq = "6.0.0-rc.28"
wreq-util = "3.0.0-rc.10"
