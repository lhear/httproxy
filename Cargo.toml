[package]
edition = "2024"
license = "MPL-2.0"
name = "httproxy"
rust-version = "1.98"
version = "0.5.1"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

[dependencies]
anyhow = "1.0.104"
aws-lc-rs = "1.19.0"
axum = {version = "0.8.9", features = ["http2", "macros"]}
base122-fast = "0.1.6"
base64 = "0.23.1"
bytes = "1.12.1"
clap = {version = "4.6.5", features = ["derive"]}
dashmap = "6.2.1"
domain = "0.12.2"
fst = "0.4.7"
futures = "0.3.33"
h2 = "0.4.15"
hkdf = "0.13.0"
http = "1.5.0"
http-body-util = "0.1.4"
httparse = "1.10"
ip_network = "0.4.1"
ip_network_table = "0.2.0"
memchr = "2.8.3"
moka = {version = "0.12", features = ["future"]}
p256 = {version = "0.14.0", features = ["ecdsa", "pkcs8"]}
pin-project-lite = "0.2"
quinn = {version = "0.11.12", default-features = false, features = [
  "runtime-tokio",
  "rustls-aws-lc-rs",
]}
rand = "0.10.2"
rand_distr = "0.6"
rcgen = {version = "0.14.10", default-features = false, features = [
  "crypto",
  "aws_lc_rs",
]}
rustls = "0.23.46"
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
sha2 = "0.11.0"
singleflight-async = "0.2"
tokio = {version = "1.54.1", features = ["rt-multi-thread", "test-util"]}
tokio-rustls = "0.26"
tokio-socks = "0.5.3"
tokio-stream = {version = "0.1.19", features = ["net"]}
toml = "1.1.4"
tower = "0.5"
tower-http = {version = "0.7.0", features = ["trace"]}
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = {version = "0.3", features = [
  "env-filter",
  "chrono",
  "json",
]}
url = "2.5"
uuid = "1.29.0"
webpki-roots = "1.0.9"
wreq = "0.16"
wreq-util = "0.2"
x25519-dalek = {version = "3.0.0", features = ["static_secrets", "getrandom", "zeroize"]}
zeroize = "1.9.0"

[dev-dependencies]
axum = {version = "0.8.9", features = ["http2", "macros"]}
quinn = {version = "0.11.12", default-features = false, features = [
  "runtime-tokio",
  "rustls-aws-lc-rs",
]}
rcgen = {version = "0.14.10", default-features = false, features = [
  "crypto",
  "aws_lc_rs",
]}
rustls = "0.23.46"
serde_json = "1.0.150"
tokio = {version = "1.54.1", features = ["full"]}
tracing-subscriber = {version = "0.3", features = ["env-filter"]}
wreq = "0.16"
wreq-util = "0.2"
